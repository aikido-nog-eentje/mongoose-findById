services:
  mongodb:
    image: mongo:8.0.6-noble
    container_name: mongoose-test-mongodb
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--noauth"]
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "try { rs.status() } catch (err) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongodb:27017'}]}) }"]
      interval: 5s
      timeout: 30s
      retries: 3

volumes:
  mongodb_data:

